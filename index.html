<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Tally</title>

    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

    <style>
        /* Ajustes específicos para centrar dentro del bloque de Tally */
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            font-family: 'Lora', serif;
            overflow: hidden; /* Evita que Tally cree scroll y rompa el centrado */
        }

        #countdown {
            display: flex;
            gap: 12px; /* Espacio reducido entre los círculos */
            text-align: center;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px; /* Espacio reducido entre el círculo y la palabra */
        }

        .number-circle {
            background-color: #9c6fbc;
            color: #ffffff;
            width: 55px;  /* Círculo más chico */
            height: 55px; /* Círculo más chico */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .number-circle span {
            font-size: 1.6rem; /* Números más chicos */
            line-height: 1;
        }

        .label {
            font-size: 0.75rem; /* Letras más chicas */
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9c6fbc;
            font-weight: 600;
        }

        #mensaje {
            display: none;
            font-size: 2.5rem;
            color: #9c6fbc;
            text-transform: uppercase;
            text-align: center;
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Prevención extra para celulares dentro de Tally */
        @media (max-width: 400px) {
            #countdown { gap: 8px; }
            .number-circle { width: 45px; height: 45px; }
            .number-circle span { font-size: 1.3rem; }
            .label { font-size: 0.65rem; }
        }
    </style>
</head>

<body>

    <div id="countdown">
        <div class="time-box">
            <div class="number-circle">
                <span id="dias">00</span>
            </div>
            <div class="label">Días</div>
        </div>
        <div class="time-box">
            <div class="number-circle">
                <span id="horas">00</span>
            </div>
            <div class="label">Horas</div>
        </div>
        <div class="time-box">
            <div class="number-circle">
                <span id="minutos">00</span>
            </div>
            <div class="label">Minutos</div>
        </div>
        <div class="time-box">
            <div class="number-circle">
                <span id="segundos">00</span>
            </div>
            <div class="label">Segundos</div>
        </div>
    </div>

    <div id="mensaje">¡Es Hoy!</div>

    <script>
        // Fecha objetivo: 21 de Noviembre de 2026 a las 21:30:00
        const fechaObjetivo = new Date(2026, 10, 21, 21, 30, 0).getTime();

        const actualizarContador = setInterval(function () {
            const ahora = new Date().getTime();
            const distancia = fechaObjetivo - ahora;

            if (distancia < 0) {
                clearInterval(actualizarContador);
                document.getElementById("countdown").style.display = "none";
                document.getElementById("mensaje").style.display = "block";
                return;
            }

            const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

            document.getElementById("dias").innerText = dias.toString().padStart(2, '0');
            document.getElementById("horas").innerText = horas.toString().padStart(2, '0');
            document.getElementById("minutos").innerText = minutos.toString().padStart(2, '0');
            document.getElementById("segundos").innerText = segundos.toString().padStart(2, '0');

        }, 1000);
    </script>
</body>

</html>
