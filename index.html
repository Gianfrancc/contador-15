<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador 15</title>

    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: transparent;
            font-family: 'Lora', serif;
        }

        #countdown {
            display: flex;
            gap: 20px;
            text-align: center;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px; /* Separación entre el círculo y la etiqueta */
        }

        /* Nuevo estilo para hacer el círculo perfecto */
        .number-circle {
            background-color: #9c6fbc;
            color: #ffffff; /* Números en blanco */
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .number-circle span {
            font-size: 2.8rem;
            line-height: 1;
        }

        .label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #9c6fbc; /* Etiquetas en color morado */
            font-weight: 600;
        }

        #mensaje {
            display: none;
            font-size: 4rem;
            color: #9c6fbc;
            text-transform: uppercase;
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Adaptación para pantallas móviles */
        @media (max-width: 600px) {
            #countdown { gap: 10px; }
            .number-circle { width: 65px; height: 65px; }
            .number-circle span { font-size: 1.8rem; }
            .label { font-size: 0.8rem; }
            #mensaje { font-size: 2.5rem; }
        }
    </style>
</head>

<body>

    <div id="countdown">
        <div class="time-box">
            <div class="number-circle">
                <span id="dias">00</span>
            </div>
            <div class="label">Días</div>
        </div>
        <div class="time-box">
            <div class="number-circle">
                <span id="horas">00</span>
            </div>
            <div class="label">Horas</div>
        </div>
        <div class="time-box">
            <div class="number-circle">
                <span id="minutos">00</span>
            </div>
            <div class="label">Minutos</div>
        </div>
        <div class="time-box">
            <div class="number-circle">
                <span id="segundos">00</span>
            </div>
            <div class="label">Segundos</div>
        </div>
    </div>

    <div id="mensaje">¡Es Hoy!</div>

    <script>
        // Fecha objetivo fijada para 2 días en el futuro (28 de Septiembre de 2026 a las 14:15:00)
        const fechaObjetivo = new Date(2026, 8, 28, 14, 15, 0).getTime();

        const actualizarContador = setInterval(function () {
            const ahora = new Date().getTime();
            const distancia = fechaObjetivo - ahora;

            if (distancia < 0) {
                clearInterval(actualizarContador);
                document.getElementById("countdown").style.display = "none";
                document.getElementById("mensaje").style.display = "block";
                return;
            }

            const dias = Math.floor(distancia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((distancia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((distancia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((distancia % (1000 * 60)) / 1000);

            document.getElementById("dias").innerText = dias.toString().padStart(2, '0');
            document.getElementById("horas").innerText = horas.toString().padStart(2, '0');
            document.getElementById("minutos").innerText = minutos.toString().padStart(2, '0');
            document.getElementById("segundos").innerText = segundos.toString().padStart(2, '0');

        }, 1000);
    </script>
</body>

</html>
